name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # repo 若部署在 https://<user>.github.io/<repo>/，請把 GHPAGES_BASE 設成 /<repo>/
      # 使用自訂網域或 <user>.github.io 根目錄時，移除這個環境變數即可
      - run: npm run build
        env:
          GHPAGES_BASE: /${{ github.event.repository.name }}/
      # sitemap 的 lastmod 自動帶入部署當天日期
      - run: sed -i "s|<lastmod>.*</lastmod>|<lastmod>$(TZ=Asia/Taipei date +%F)</lastmod>|" dist/sitemap.xml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
